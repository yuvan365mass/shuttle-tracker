<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#14181f;color:#e8ecef;font-family:system-ui,sans-serif;padding:20px;text-align:center}
button{width:180px;height:180px;border-radius:50%;border:0;font-size:18px;font-weight:700;background:#ffb020;color:#1a1300}
button.on{background:#34d399;color:#052015}
#info{font-family:monospace;font-size:13px;color:#8b95a1;line-height:1.7}
small{color:#5b6670;max-width:320px;font-size:11.5px;line-height:1.5}
</style></head><body>
<button id="btn">Start sharing</button>
<div id="info">Not sharing</div>
<small>Keep this screen on while sharing. Then open navicast.vercel.app on another device to see the dot move.</small>
<script>
const API = 'https://navicast.vercel.app/api/location';
let watchId = null, sent = 0, lock = null;
const btn = document.getElementById('btn'), info = document.getElementById('info');

function send(pos) {
  const c = pos.coords;
  // String body = text/plain, no preflight. Server's request.json() still parses it.
  fetch(API, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ latitude: c.latitude, longitude: c.longitude, accuracy: c.accuracy })
  }).then(() => {
    sent++;
    info.innerHTML = c.latitude.toFixed(6) + ', ' + c.longitude.toFixed(6) +
      '<br>accuracy ' + Math.round(c.accuracy) + ' m · sent ' + sent;
  }).catch(e => { info.textContent = 'Send failed: ' + e.message; });
}

async function start() {
  if (!navigator.geolocation) { info.textContent = 'No GPS support in this browser'; return; }
  watchId = navigator.geolocation.watchPosition(send,
    err => { info.textContent = 'Location error: ' + err.message; },
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
  btn.classList.add('on'); btn.textContent = 'Stop sharing';
}
function stop() {
  navigator.geolocation.clearWatch(watchId); watchId = null;
  if (lock) { lock.release(); lock = null; }
  btn.classList.remove('on'); btn.textContent = 'Start sharing'; info.textContent = 'Not sharing';
}
btn.onclick = () => (watchId === null ? start() : stop());
</script></body></html>
